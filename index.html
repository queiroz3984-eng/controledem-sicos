<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Músicos</title>
<style>
:root{--primary:#1b365d;--accent:#2c4d75;--bg:#f4f7fa;--card:#fff;--border:#dbe2ea;--male:#0284c7;--female:#ec4899;--danger:#e11d48;--success:#15803d;--purple:#6d28d9;--text:#1e293b;--muted:#64748b}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:var(--bg);color:var(--text);padding:16px;max-width:1100px;margin:0 auto}
.header-title{text-align:center;color:var(--primary);font-size:28px;font-weight:800;margin-bottom:4px}.header-subtitle{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px}
.total-card{background:var(--primary);color:#fff;border-radius:12px;padding:16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:16px}.total-card .label{font-size:13px;font-weight:800;letter-spacing:.5px}.total-card .number{font-size:34px;font-weight:900;line-height:1.1;margin:6px 0}.total-card .breakdown{font-size:13px;font-weight:600}
.instrument-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.instrument-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 9px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}.instrument-name{font-size:11px;font-weight:800;color:var(--primary);text-transform:uppercase;min-height:30px;display:flex;align-items:center;justify-content:center}.instrument-total{font-size:25px;font-weight:900;color:var(--primary);margin:3px 0 8px}.gender-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;border-top:1px solid var(--border);padding-top:8px}.gender-box{min-width:0}.gender-label{font-size:9px;font-weight:900;text-transform:uppercase;margin-bottom:5px}.gender-label.male{color:var(--male)}.gender-label.female{color:var(--female)}.counter-line{display:flex;align-items:center;justify-content:center;gap:4px}.count-value{font-size:14px;font-weight:900;min-width:20px}.btn-count{width:25px;height:25px;border:0;border-radius:5px;color:#fff;font-size:17px;font-weight:900;cursor:pointer;line-height:25px}.btn-male{background:var(--male)}.btn-female{background:var(--female)}.btn-count:active{transform:scale(.96);opacity:.85}.btn-count:disabled{opacity:.45;cursor:not-allowed}
.special-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}.special-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.controls-section{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}.controls-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.date-input{padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:14px;min-width:160px}.btn-action{border:0;color:#fff;padding:10px 14px;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer}.btn-send{background:var(--success)}.btn-reset{background:var(--danger)}.btn-report{background:var(--primary)}.btn-add{background:var(--purple)}.add-church-row{display:flex;gap:8px;margin-top:10px}.add-church-row.open{display:flex}.add-church-input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none}.add-church-input:focus{border-color:var(--primary)}
.churches-section{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.04)}.section-title{font-size:14px;font-weight:900;color:var(--primary);text-transform:uppercase;margin-bottom:10px}.church-list{display:flex;flex-direction:column;gap:7px}.church-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#f8fafc}.church-name{font-weight:800;color:var(--primary)}.church-total{font-size:12px;color:var(--muted);font-weight:700}.church-actions{display:flex;gap:6px}.btn-small{border:0;border-radius:6px;padding:6px 9px;font-size:11px;font-weight:800;color:#fff;cursor:pointer}.btn-edit{background:var(--accent)}.btn-delete{background:var(--danger)}.empty-churches{padding:24px 10px;text-align:center;border:1px dashed #b8c6d8;border-radius:9px;color:var(--muted);font-weight:700}.empty-churches strong{display:block;color:var(--primary);margin-bottom:4px}
#print-report{display:none}.report-card{border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px}.report-title{font-weight:900;color:var(--primary);margin-bottom:4px}.report-line{font-size:12px;margin:3px 0}.report-total-box{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px}.report-total-line{font-size:14px;font-weight:900;color:var(--primary);margin:4px 0}
@media(max-width:850px){body{max-width:760px}.instrument-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){body{padding:10px}.header-title{font-size:22px}.instrument-grid{grid-template-columns:repeat(2,1fr);gap:8px}.special-grid{grid-template-columns:1fr 1fr}.controls-row>*{flex:1 1 140px}.date-input{min-width:140px}.add-church-row{flex-direction:column}}
@media print{body{max-width:none;background:#fff;padding:10px}.header-subtitle,.total-card,#selected-church,.instrument-grid,.special-grid,.controls-section,.churches-section{display:none!important}#print-report{display:block!important}.report-card{box-shadow:none}.report-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}}
</style>
</head>
<body>
<h1 class="header-title">Control de Músicos</h1>
<p class="header-subtitle">Haga clic en los botones + y − para sumar en tiempo real</p>

<div class="total-card">
  <div class="label">TOTAL GENERAL</div>
  <div class="number" id="total-geral">0</div>
  <div class="breakdown">Músicos contabilizados · H: <span id="total-h">0</span> · M: <span id="total-m">0</span></div>
</div>

<div id="selected-church" style="display:none;background:#eaf2fb;border:1px solid #c9d8ea;color:var(--primary);border-radius:9px;padding:9px 12px;margin-bottom:10px;text-align:center;font-size:13px;font-weight:800"></div>
<div id="instrument-grid" class="instrument-grid"></div>
<div id="special-grid" class="special-grid"></div>

<div class="controls-section">
  <div class="controls-row">
    <input type="text" id="fecha-envio-ensayo" class="date-input" placeholder="DD/MM/AAAA" maxlength="10" inputmode="numeric">
    <button class="btn-action btn-send" onclick="enviarAListaEnsayo()">📤 Enviar a Lista Ensayo</button>
    <button class="btn-action btn-reset" onclick="resetCounts()">🔄 Reiniciar Conteo</button>
    <button class="btn-action btn-report" onclick="printReport()">🖨️ Generar Informe</button>
    </div>
  <div class="add-church-row" id="add-church-row">
    <input type="text" id="new-church-input" class="add-church-input" placeholder="Nombre de la iglesia" onkeydown="if(event.key==='Enter') addChurch()">
    <button class="btn-action btn-add" onclick="addChurch()">➕ Agregar Iglesia</button>
  </div>
</div>

<div class="churches-section">
  <div class="section-title">Iglesias agregadas</div>
  <div id="church-list" class="church-list"></div>
</div>

<div id="print-report">
  <div class="report-card"><div class="report-title">INSTRUMENTOS</div><div id="report-instruments" class="report-grid"></div></div>
  <div class="report-total-box">
    <div class="report-title">RESUMEN</div>
    <div class="report-total-line">Total de Músicos: <span id="report-total-musicians">0</span></div>
    <div class="report-total-line">Total de Irmandade: <span id="report-total-brotherhood">0</span></div>
    <div class="report-total-line">Total General: <span id="report-total-general">0</span></div>
  </div>
  <div class="report-card"><div class="report-title">IGLESIAS PRESENTES</div><div id="report-churches"></div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyARs_bBI9r_05tyjmMJmS5UOSV8SVJuisc",
 authDomain:"controle-de-musicos.firebaseapp.com",
 databaseURL:"https://controle-de-musicos-default-rtdb.firebaseio.com",
 projectId:"controle-de-musicos",
 storageBucket:"controle-de-musicos.firebasestorage.app",
 messagingSenderId:"627708395277",
 appId:"1:627708395277:web:4e1f889fbde36bd1c2ba44"
};
const app=initializeApp(firebaseConfig); const db=getDatabase(app); const dataRef=ref(db,"controleMusicos");
const CHURCH_MODE="manual-only-v2";

const instrumentDefs=[
 {label:"Organistas",key:"organistas"},
 {label:"Organistas Musicistas",key:"organistas_musicistas",excludedFromTotal:true},
 {label:"Acordeones",key:"acordeones"},
 {label:"Violines",key:"violines"},
 {label:"Violas",key:"violas"},
 {label:"Cellos",key:"cellos"},
 {label:"Flautas",key:"flautas"},
 {label:"Clarinetes",key:"clarinetes"},
 {label:"Clarones",key:"clarones"},
 {label:"Oboes",key:"oboes"},
 {label:"Fagots",key:"fagots"},
 {label:"Saxo-Soprano",key:"saxo_soprano"},
 {label:"Saxo-Alto",key:"saxo_alto"},
 {label:"Saxo-Tenor",key:"saxo_tenor"},
 {label:"Saxo-Barítono",key:"saxo_baritono"},
 {label:"Trompetas",key:"trompetas"},
 {label:"Fiscornios",key:"fiscornios"},
 {label:"Trompas",key:"trompas"},
 {label:"Trombonitos",key:"trombonitos"},
 {label:"Trombones",key:"trombones"},
 {label:"Bombardinos",key:"bombardinos"},
 {label:"Tuba",key:"tuba"}
];

const emptyData=()=>{
 const d={}; instrumentDefs.forEach(i=>{d[i.key]=0;d[`${i.key}_h`]=0;d[`${i.key}_m`]=0}); d.hermanos=0;d.hermanas=0; return d;
};
let initialChurches=[]; let churchData={}; let selectedChurch="";

function normaliseData(data){
 const result={};
 Object.entries(data||{}).forEach(([name,values])=>{
  const v=values||{}; const item={...emptyData(),...v};
  instrumentDefs.forEach(i=>{
   const h=`${i.key}_h`,m=`${i.key}_m`;
   if(v[h]===undefined&&v[m]===undefined){item[h]=Number(v[i.key])||0;item[m]=0}else{item[h]=Number(v[h])||0;item[m]=Number(v[m])||0}
   item[i.key]=item[h]+item[m];
  });
  item.hermanos=Number(v.hermanos)||0; item.hermanas=Number(v.hermanas)||0;
  result[name]=item;
 });
 initialChurches.forEach(name=>{if(!result[name])result[name]=emptyData()});
 return result;
}
function getChurchTotal(data){return instrumentDefs.reduce((t,i)=>t+(i.excludedFromTotal?0:(Number(data?.[i.key])||0)),0)+(Number(data?.hermanos)||0)+(Number(data?.hermanas)||0)}
function getAllTotals(){
 const totals={...Object.fromEntries(instrumentDefs.map(i=>[i.key,0])),hermanos:0,hermanas:0};
 initialChurches.forEach(name=>{
  const d=churchData[name]||emptyData();
  instrumentDefs.forEach(i=>{
   if(i.key==='organistas_musicistas') totals[i.key]+=Number(d[`${i.key}_m`])||0;
   else totals[i.key]+=Number(d[i.key])||0;
  });
  totals.hermanos+=Number(d.hermanos)||0;
  totals.hermanas+=Number(d.hermanas)||0;
 });
 return totals;
}
function getGrandTotal(t){return instrumentDefs.reduce((x,i)=>x+(i.excludedFromTotal?0:(Number(t[i.key])||0)),0)+(Number(t.hermanos)||0)+(Number(t.hermanas)||0)}
function getGenderTotals(){
 let h=0,m=0;
 initialChurches.forEach(name=>{
  const d=churchData[name]||emptyData();
  instrumentDefs.forEach(i=>{
   if(i.key==='organistas_musicistas') return;
   h+=Number(d[`${i.key}_h`])||0;
   m+=Number(d[`${i.key}_m`])||0;
  });
 });
 return{h,m};
}
function saveData(){set(dataRef,{churchMode:CHURCH_MODE,churches:initialChurches,data:churchData}).catch(e=>{console.error(e);alert("No fue posible guardar los datos en Firebase.")})}
function changeVal(church,field,delta){
 if(!churchData[church])churchData[church]=emptyData();
 churchData[church][field]=Math.max(0,(Number(churchData[church][field])||0)+delta);
 const base=field.replace(/_(h|m)$/,'');
 const instrument=instrumentDefs.find(i=>i.key===base);
 if(instrument)churchData[church][instrument.key]=(Number(churchData[church][`${base}_h`])||0)+(Number(churchData[church][`${base}_m`])||0);
 saveData();updateUI();
}
function safe(s){return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'")}
function renderInstrumentCards(){
 const grid=document.getElementById("instrument-grid"); grid.innerHTML="";
 instrumentDefs.forEach(i=>{
  const total=getAllTotals()[i.key]||0;
  const card=document.createElement("div"); card.className="instrument-card";
  if(i.key==='organistas' || i.key==='organistas_musicistas'){
   card.innerHTML=`<div class="instrument-name">${i.label}</div>
   <div class="gender-row"><div class="gender-box" style="grid-column:1/-1">
    <div class="gender-label female">Hermanas</div>
    <div class="counter-line"><button class="btn-count btn-female" onclick="adjustGlobal('${i.key}_m',-1)">−</button><span class="count-value" id="global-${i.key}-m">0</span><button class="btn-count btn-female" onclick="adjustGlobal('${i.key}_m',1)">+</button></div>
   </div></div>`;
  }else{
   card.innerHTML=`<div class="instrument-name">${i.label}</div><div class="instrument-total">${total}</div>
   <div class="gender-row">
    <div class="gender-box"><div class="gender-label male">Hermanos</div><div class="counter-line"><button class="btn-count btn-male" onclick="adjustGlobal('${i.key}_h',-1)">−</button><span class="count-value" id="global-${i.key}-h">0</span><button class="btn-count btn-male" onclick="adjustGlobal('${i.key}_h',1)">+</button></div></div>
    <div class="gender-box"><div class="gender-label female">Hermanas</div><div class="counter-line"><button class="btn-count btn-female" onclick="adjustGlobal('${i.key}_m',-1)">−</button><span class="count-value" id="global-${i.key}-m">0</span><button class="btn-count btn-female" onclick="adjustGlobal('${i.key}_m',1)">+</button></div></div>
   </div>`;
  }
  grid.appendChild(card);
 });
 instrumentDefs.forEach(i=>{const hEl=document.getElementById(`global-${i.key}-h`);const mEl=document.getElementById(`global-${i.key}-m`);if(hEl)hEl.textContent=sumField(`${i.key}_h`);if(mEl)mEl.textContent=sumField(`${i.key}_m`)});
}
function sumField(field){let n=0;initialChurches.forEach(name=>n+=Number(churchData[name]?.[field])||0);return n}
function renderSpecialCards(){
 const grid=document.getElementById("special-grid");grid.innerHTML="";
 const specs=[{label:"Hermanos",key:"hermanos",gender:"Hermanos",cls:"male"},{label:"Hermanas",key:"hermanas",gender:"Hermanas",cls:"female"}];
 const totals=getAllTotals();
 specs.forEach(s=>{const card=document.createElement("div");card.className="special-card";card.innerHTML=`<div class="instrument-name">${s.label}</div><div class="instrument-total">${totals[s.key]||0}</div><div class="gender-row"><div class="gender-box" style="grid-column:1/-1"><div class="gender-label ${s.cls}">${s.gender}</div><div class="counter-line"><button class="btn-count ${s.cls==='male'?'btn-male':'btn-female'}" onclick="adjustGlobal('${s.key}',-1)">−</button><span class="count-value" id="global-${s.key}">${totals[s.key]||0}</span><button class="btn-count ${s.cls==='male'?'btn-male':'btn-female'}" onclick="adjustGlobal('${s.key}',1)">+</button></div></div></div>`;grid.appendChild(card)});
}
function renderChurches(){
 const box=document.getElementById("church-list");box.innerHTML="";
 if(!initialChurches.length){box.innerHTML='<div class="empty-churches"><strong>Aún no hay iglesias agregadas.</strong>Use “Agregar Iglesias” para registrar la primera.</div>';return}
 initialChurches.forEach(name=>{const item=document.createElement("div");item.className="church-item";const selected=name===selectedChurch;item.style.borderColor=selected?"#1b365d":"";item.style.background=selected?"#eef5ff":"";item.style.cursor="pointer";item.onclick=()=>selectChurch(name);item.innerHTML=`<div><div class="church-name">${selected?'✓ ':''}${name}</div></div><div class="church-actions"><button class="btn-small" style="background:var(--accent)" onclick="event.stopPropagation();editChurch('${safe(name)}')">Editar</button><button class="btn-small btn-delete" onclick="event.stopPropagation();deleteChurch('${safe(name)}')">Eliminar</button></div>`;box.appendChild(item)});
}
function updateUI(){const totals=getAllTotals(),gt=getGrandTotal(totals),g=getGenderTotals();document.getElementById("total-geral").textContent=gt;document.getElementById("total-h").textContent=g.h;document.getElementById("total-m").textContent=g.m;const banner=document.getElementById("selected-church");if(selectedChurch){banner.style.display="block";banner.textContent=`Iglesia seleccionada para contar: ${selectedChurch}`}else{banner.style.display="none"}renderInstrumentCards();renderSpecialCards();renderChurches()}
function adjustGlobal(field,delta){
 if(!initialChurches.length){alert("Agregue una iglesia primero para comenzar el conteo.");focusAddChurch();return}
 const church=(selectedChurch && initialChurches.includes(selectedChurch))?selectedChurch:initialChurches[0];
 changeVal(church,field,delta);
}
function focusAddChurch(){const row=document.getElementById("add-church-row"),input=document.getElementById("new-church-input");row.classList.add("open");row.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>input.focus(),150)}
function addChurch(){const input=document.getElementById("new-church-input"),name=input.value.trim().replace(/\s+/g," ").toUpperCase();if(!name){alert("Ingrese el nombre de la iglesia.");input.focus();return}if(initialChurches.some(c=>c.toLowerCase()===name.toLowerCase())){alert("Esta iglesia ya está en la lista.");input.focus();return}initialChurches.push(name);churchData[name]=emptyData();input.value="";saveData();updateUI()}
function selectChurch(name){if(!initialChurches.includes(name))return;selectedChurch=name;updateUI();document.getElementById("instrument-grid").scrollIntoView({behavior:"smooth",block:"start"})}
function editChurch(name){const oldName=name;const novo=prompt("Editar nombre de la iglesia:",oldName);if(novo===null)return;const newName=novo.trim().replace(/\s+/g," ").toUpperCase();if(!newName||newName===oldName)return;if(initialChurches.some(c=>c.toLowerCase()===newName.toLowerCase())){alert("Esta iglesia ya está en la lista.");return}const idx=initialChurches.indexOf(oldName);initialChurches[idx]=newName;churchData[newName]=churchData[oldName]||emptyData();delete churchData[oldName];saveData();updateUI()}
function deleteChurch(name){if(!confirm(`¿Eliminar la iglesia “${name}” y todos sus conteos?`))return;initialChurches=initialChurches.filter(c=>c!==name);delete churchData[name];if(selectedChurch===name)selectedChurch="";saveData();updateUI()}
function resetCounts(){
  if(!confirm("¿Desea reiniciar todo? Se pondrán todos los conteos en cero y se eliminarán todas las iglesias agregadas."))return;
  initialChurches=[];
  churchData={};
  selectedChurch="";
  set(dataRef,{churchMode:CHURCH_MODE,churches:[],data:{}}).then(()=>updateUI()).catch(e=>{
    console.error(e);
    alert("No fue posible reiniciar los datos en Firebase.");
  });
}
function formatarDataParaFirebase(valor){const p=String(valor||"").trim().split("/");if(p.length!==3)return null;const[d,m,y]=p;if(!/^\d{2}$/.test(d)||!/^[0-9]{2}$/.test(m)||!/^[0-9]{4}$/.test(y))return null;return `${d}-${m}-${y}`}
function obterTotaisContador(){const totals=getAllTotals(),totalMusicos=getGrandTotal(totals),iglesiasConMusicos=initialChurches.filter(n=>getChurchTotal(churchData[n])>0);return{totals,totalMusicos,iglesiasConMusicos}}
async function enviarAListaEnsayo(){const input=document.getElementById("fecha-envio-ensayo"),dataTexto=input.value.trim(),chave=formatarDataParaFirebase(dataTexto);if(!chave){alert("Ingrese una fecha válida en formato DD/MM/AAAA.");input.focus();return}const{totals,totalMusicos,iglesiasConMusicos}=obterTotaisContador();if(initialChurches.length>25)alert(`Hay ${initialChurches.length} iglesias agregadas. Se enviarán las primeras 25.`);if(!confirm(`Enviar al ensayo del ${dataTexto}?\n\nTotal músicos: ${totalMusicos}\nIglesias participantes: ${initialChurches.length}`))return;const instrumentos={};instrumentDefs.forEach(i=>instrumentos[i.key]=totals[i.key]||0);instrumentos.organistas=(Number(totals.organistas)||0)+(Number(totals.organistas_musicistas)||0);const participantes={};for(let i=1;i<=25;i++)participantes[`c${i}`]=null;initialChurches.slice(0,25).forEach((ig,index)=>participantes[`c${index+1}`]=ig);try{const url=`https://lista-ensayo-regional-default-rtdb.firebaseio.com/ensayos/${chave}.json`;const response=await fetch(url,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({meta:{fecha:dataTexto},instrumentos,participantes,observaciones:{hermanas:totals.hermanas||0,hermanos:totals.hermanos||0,total_musicos:totalMusicos},contadorMusicos:{total:totalMusicos,iglesias_con_musicos:iglesiasConMusicos}})});if(!response.ok)throw new Error(await response.text()||`HTTP ${response.status}`);alert(`¡Datos enviados correctamente a Lista Ensayo!\n\nEnsayo: ${dataTexto}\nTotal músicos: ${totalMusicos}`)}catch(e){console.error(e);alert('No fue posible enviar los datos a Lista Ensayo. Verifique las reglas de escritura del Realtime Database del proyecto "lista-ensayo-regional".')}}
function printReport(){
 const {totals,totalMusicos,iglesiasConMusicos}=obterTotaisContador();
 const totalIrmandade=(Number(totals.hermanos)||0)+(Number(totals.hermanas)||0);

 // No informe, Organistas Musicistas são somadas às Organistas,
 // mas não aparecem como instrumento separado.
 const reportTotals={...totals};
 reportTotals.organistas=(Number(totals.organistas)||0)+(Number(totals.organistas_musicistas)||0);

 // Total de Músicos = soma dos instrumentos, com Musicistas incorporadas em Organistas.
 const totalMusicosInforme=instrumentDefs.reduce((sum,i)=>{
   if(i.key==='organistas_musicistas') return sum;
   return sum+(Number(totals[i.key])||0);
 },0);

 // Total General do contador continua sem somar Organistas Musicistas.
 const totalGeneralSemMusicistas=getGrandTotal(totals);

 document.getElementById("report-total-musicians").textContent=totalMusicosInforme;
 document.getElementById("report-total-brotherhood").textContent=totalIrmandade;
 document.getElementById("report-total-general").textContent=totalGeneralSemMusicistas;

 const instrumentosConMusicos=instrumentDefs.filter(i=>i.key!=='organistas_musicistas' && (Number(reportTotals[i.key])||0)>0);
 document.getElementById("report-instruments").innerHTML=instrumentosConMusicos.length
   ? instrumentosConMusicos.map(i=>`<div class="report-card"><div class="report-title">${i.label}</div><div class="report-line">Cantidad: ${reportTotals[i.key]||0}</div></div>`).join("")
   : '<div class="report-line">No hay instrumentos con músicos contabilizados.</div>';

 // Todas las iglesias agregadas aparecen en el informe, tengan o no músicos contados.
 document.getElementById("report-churches").innerHTML=initialChurches.length
   ? initialChurches.map(n=>`<div class="report-line">• ${n}</div>`).join("")
   : "No hay iglesias agregadas.";

 const old=document.title;document.title="Informe - Control de Músicos";window.print();setTimeout(()=>document.title=old,500)
}

window.changeVal=changeVal;window.adjustGlobal=adjustGlobal;window.addChurch=addChurch;window.editChurch=editChurch;window.deleteChurch=deleteChurch;window.resetCounts=resetCounts;window.printReport=printReport;window.enviarAListaEnsayo=enviarAListaEnsayo;window.focusAddChurch=focusAddChurch;window.selectChurch=selectChurch;

initialChurches=[];churchData={};selectedChurch="";updateUI();
onValue(dataRef,snapshot=>{const value=snapshot.val();if(!value||value.churchMode!==CHURCH_MODE){initialChurches=[];churchData={};selectedChurch="";set(dataRef,{churchMode:CHURCH_MODE,churches:[],data:{}}).catch(console.error);updateUI();return}initialChurches=[];if(Array.isArray(value.churches))value.churches.forEach(name=>{const n=String(name||"").trim().replace(/\s+/g," ").toUpperCase();if(n&&!initialChurches.some(c=>c.toLowerCase()===n.toLowerCase()))initialChurches.push(n)});churchData=normaliseData(value.data||{});if(selectedChurch&&!initialChurches.includes(selectedChurch))selectedChurch="";updateUI()},error=>{console.error(error);alert("Erro ao conectar ao Firebase. Pode adicionar igrejas manualmente quando a conexão voltar.")});
